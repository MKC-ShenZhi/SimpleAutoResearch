# Official DeepSeek Chat API. Copy to your private model catalog; keep the key
# in DEEPSEEK_API_KEY. This does not change connections saved by existing tasks.
# Docs: https://api-docs.deepseek.com/guides/thinking_mode/
#       https://api-docs.deepseek.com/guides/vision/
version = 1

[routes]
default = "agent"
code = "agent"
writing = "agent"
vision = "figure_eye"

[profiles.agent]
api = "openai_chat"
base_url = "https://api.deepseek.com"
model = "deepseek-flash"
api_key_env = "DEEPSEEK_API_KEY"
capabilities = ["text", "code"]
stream = true
thinking_mode = "enabled"
reasoning_effort = "high"
request_timeout_sec = 600
connect_timeout_sec = 30
max_output_tokens = 32768
context_input_tokens = 48000
chat_token_limit_param = "max_tokens"
retry_attempts = 1
connect_retry_attempts = 3

# Image understanding, not image generation. Review output includes reasoning.
[profiles.figure_eye]
api = "openai_chat"
base_url = "https://api.deepseek.com"
model = "deepseek-flash"
api_key_env = "DEEPSEEK_API_KEY"
capabilities = ["vision"]
stream = true
thinking_mode = "enabled"
reasoning_effort = "low"
request_timeout_sec = 600
connect_timeout_sec = 30
max_output_tokens = 8192
context_input_tokens = 24000
chat_token_limit_param = "max_tokens"
retry_attempts = 1
connect_retry_attempts = 3
