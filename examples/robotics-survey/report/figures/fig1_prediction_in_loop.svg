<text x="917.5" y="808.1" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1c2530" text-anchor="middle">inverse-dynamics labels (D1) or reward (D2)</text>
