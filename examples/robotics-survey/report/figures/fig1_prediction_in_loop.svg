<text x="327.5" y="764.8" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="normal" font-style="normal" fill="#1c2530" text-anchor="middle">roll the model forward: z_1 ... z_T</text>
