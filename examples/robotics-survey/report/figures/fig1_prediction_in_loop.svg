<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="1085" viewBox="0 0 1250 1085">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f5d8a"/></marker></defs>
<rect width="1250" height="1085" fill="#ffffff"/>
<text x="40.0" y="46.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" font-style="normal" fill="#1c2530" text-anchor="start">Figure 1. Where prediction sits in the control loop</text>
<text x="40.0" y="78.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#55606d" text-anchor="start">Four families that are often compared as if they were one. Boxes show what is computed; the dashed note shows what is supervised.</text>
<text x="40.0" y="100.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#55606d" text-anchor="start">Solid arrows are data flow, not compute cost. Conceptual diagram: no published score is encoded.</text>
