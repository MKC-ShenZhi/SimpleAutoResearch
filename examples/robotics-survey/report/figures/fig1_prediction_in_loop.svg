<text x="58.0" y="610.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" font-style="italic" fill="#55606d" text-anchor="start">DINO-WM, V-JEPA 2-AC</text>
