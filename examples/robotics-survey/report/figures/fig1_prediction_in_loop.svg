<rect x="648.0" y="448.0" width="539.0" height="62.0" rx="8" fill="#fff8e6" stroke="#b98a20" stroke-width="1.6" stroke-dasharray="6,5"/>
<text x="917.5" y="473.7" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#1c2530" text-anchor="middle">Predicts: actions and future frames.</text>
<text x="917.5" y="495.2" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#1c2530" text-anchor="middle">Frames are co-trained, never executed.</text>
