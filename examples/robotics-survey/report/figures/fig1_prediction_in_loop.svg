<line x1="327.5" y1="780.0" x2="327.5" y2="787.0" stroke="#2f5d8a" stroke-width="2.2" marker-end="url(#ah)"/>
<line x1="327.5" y1="832.0" x2="327.5" y2="839.0" stroke="#2f5d8a" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="58.0" y="896.0" width="539.0" height="48.0" rx="8" fill="#fff8e6" stroke="#b98a20" stroke-width="1.6" stroke-dasharray="6,5"/>
<text x="327.5" y="925.1" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1c2530" text-anchor="middle">Predicts: future states; the prediction is the controller.</text>
<rect x="648.0" y="634.0" width="539.0" height="38.0" rx="8" fill="#ffffff" stroke="#8a97a8" stroke-width="1.6"/>
<text x="917.5" y="658.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#1c2530" text-anchor="middle">a little teleoperated data + cheap video</text>
<rect x="648.0" y="684.0" width="539.0" height="38.0" rx="8" fill="#ffffff" stroke="#8a97a8" stroke-width="1.6"/>
<text x="917.5" y="708.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#1c2530" text-anchor="middle">action-conditioned video world model</text>
<rect x="648.0" y="734.0" width="539.0" height="38.0" rx="8" fill="#ffffff" stroke="#8a97a8" stroke-width="1.6"/>
<text x="917.5" y="758.4" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#1c2530" text-anchor="middle">synthetic futures / imagined rollouts</text>
