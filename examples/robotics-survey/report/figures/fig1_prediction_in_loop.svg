<line x1="917.5" y1="822.0" x2="917.5" y2="831.0" stroke="#2f5d8a" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="648.0" y="884.0" width="539.0" height="60.0" rx="8" fill="#fff8e6" stroke="#b98a20" stroke-width="1.6" stroke-dasharray="6,5"/>
<text x="917.5" y="909.1" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1c2530" text-anchor="middle">Predicts: futures as data or as a training environment.</text>
<text x="917.5" y="929.2" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1c2530" text-anchor="middle">The model never touches the actuators.</text>
<line x1="40" y1="985" x2="1210" y2="985" stroke="#dfe4ea" stroke-width="1.2"/>
<text x="40.0" y="1013.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#55606d" text-anchor="start">The question that separates the families is not what the network looks like, but what it is trained to output</text>
<text x="40.0" y="1036.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#55606d" text-anchor="start">and whether that output is optimised during control, executed directly, or consumed offline to manufacture training signal.</text>
<text x="40.0" y="1066.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" font-style="normal" fill="#8a97a8" text-anchor="start">Conceptual diagram prepared for this survey. A realistic-looking predicted video is not evidence of successful control.</text>
</svg>