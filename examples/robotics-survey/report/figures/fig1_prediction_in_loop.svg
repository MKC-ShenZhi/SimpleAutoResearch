<line x1="917.5" y1="324.0" x2="1057.8" y2="341.0" stroke="#2f5d8a" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="648.0" y="404.0" width="539.0" height="48.0" rx="8" fill="#ffffff" stroke="#8a97a8" stroke-width="1.6"/>
