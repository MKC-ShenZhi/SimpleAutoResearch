<text x="58.0" y="180.0" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" font-style="italic" fill="#55606d" text-anchor="start">OpenVLA, pi0, SmolVLA, GR00T N1</text>
<rect x="630" y="130" width="575" height="400" rx="12" fill="#ffffff" stroke="#c6cfda" stroke-width="1.6"/>
<rect x="630" y="130" width="575" height="62" rx="12" fill="#e6eef8"/>
