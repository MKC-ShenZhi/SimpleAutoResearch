[project]
name = "simple-autoresearch"
version = "0.1.0"
description = "A task-driven research framework for inspectable evidence, code changes, experiments, and reports."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "arxiv>=3.0.0",
    "matplotlib>=3.10",
    "markdown-it-py>=4",
    "openai>=2.34.0",
    "packaging>=24.0",
    "pyalex>=0.21",
    "pydantic>=2.13.3",
    "pypdf[fonts]>=6.19.0",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "tqdm>=4.67.3",
]

[project.optional-dependencies]
litellm = ["litellm>=1.86.2"]
examples = ["scikit-learn>=1.8.0"]
http2 = ["h2>=4,<5"]

[project.scripts]
simple-ar = "simple_ar.cli.main:main"
simple-ar-checks = "simple_ar.app.dev_checks:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# Also safe to build from an exported tree without Git metadata.
include = [
    "/src", "/templates/report", "/tests", "/examples", "/docs",
    # Source-tree test and adapter consumers; never include benchmark outputs.
    "/benchmark/__init__.py", "/benchmark/adapter_contract.py",
    "/benchmark/arc_bench/adapter.py", "/benchmark/arc_bench/batch_runner.py",
    "/benchmark/arc_bench/README.md", "/benchmark/arc_bench/README_zh.md",
    "/benchmark/arc_bench/ADAPTER_CONTRACT.md", "/benchmark/arc_bench/config.example.toml",
    "/benchmark/survey_bench/adapter.py",
    "/benchmark/survey_bench/README.md", "/benchmark/survey_bench/README_zh.md",
    "/README.md", "/README_zh.md", "/CHANGELOG.md", "/CHANGELOG_zh.md",
    "/pyproject.toml", "/uv.lock", "/LICENSE*",
]
exclude = [
    "**/__pycache__", "**/*.pyc", "**/.pytest_cache", "**/.env", "**/.env.*",
    "**/.venv", "**/venv", "**/.git",
]
# The documented empty connection template is public, not a credential file.
artifacts = ["/.env.example"]

[tool.hatch.build.targets.wheel]
packages = ["src/simple_ar"]

[tool.hatch.build.targets.wheel.force-include]
"templates/report" = "simple_ar/report_templates"
